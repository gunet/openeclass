server {
    listen 80;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 256M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    rewrite "^/courses/[0-9A-Z_-]{4,25}/(index.php)?$" /index.php last;

    # never execute scripts from uploaded course content (except the courses/<CODE>/index.php stubs)
    location ~* "^/courses/(?![^/]+/index\.php$)[^/]+/.+\.(php.?|phtml|phar)$" {
        deny all;
    }

    location ~ [^/]\.php($|/) {
        location ~ \..*/.*\.php$ {
            return  404;
        }
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
