name: Tag Docker Hub Latest

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing tag to alias (e.g., Release_4.4.3)'
        required: true
        default: 'Release_4.4.3'

jobs:
  tag-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Copy manifest to latest on Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: |
          skopeo copy \
            --src-creds "${DOCKER_USERNAME}:${DOCKER_PASSWORD}" \
            --dest-creds "${DOCKER_USERNAME}:${DOCKER_PASSWORD}" \
            docker://docker.io/gunet/openeclass:${{ inputs.source_tag }} \
            docker://docker.io/gunet/openeclass:latest
