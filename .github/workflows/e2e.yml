name: E2E Tests
run-name: Playwright E2E tests (${{ github.ref_name }})

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check the suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/e2e-pw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install test dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run test:e2e:typecheck

  # The jobs are listed here rather than discovered from the spec folders. Playwright splits the specs
  # between the shards (`--shard=i/n`, by whole spec file since the suite runs serially), so new specs
  # need no change here: when the run gets slow, add a shard and bump `n` in every entry.
  # Every job has its own stack: the `setup` project installs, seeds and logs every role in first.
  # `install` is the exception: its specs need an empty site, so it runs on its own (test:e2e:install
  # wipes the stack and runs only the wizard project).
  e2e:
    name: ${{ matrix.name }}
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Install wizard
            command: test:e2e:install
            id: install
          - name: E2E (1/2)
            command: test:e2e --shard=1/2
            id: shard-1
          - name: E2E (2/2)
            command: test:e2e --shard=2/2
            id: shard-2
    defaults:
      run:
        working-directory: tests/e2e-pw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install test dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Builds the image and starts eclass, db and mailpit (docker-compose.e2e.yaml).
      # The suite would start it too, but a separate step keeps build errors apart from test failures.
      - name: Start the e2e stack
        run: bun run e2e:up

      - name: Run tests
        run: bun run ${{ matrix.command }}
        env:
          CI: true

      # - name: Stack logs
      #   if: failure()
      #   run: bun run e2e:compose logs --no-color --timestamps

      # Needs the blob reporter in playwright.config.ts; the `report` job below merges the blobs.
      # - name: Upload blob report
      #   if: ${{ !cancelled() }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: blob-report-${{ matrix.id }}
      #     path: tests/e2e-pw/blob-report
      #     retention-days: 7

      - name: Stop the e2e stack
        if: always()
        run: bun run e2e:compose down -v

